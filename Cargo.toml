[package]
name = "zk-stark-vm"
version = "0.1.0"
edition = "2024"
description = "A from-scratch STARK proof system in Rust: finite field, NTT, FRI, AIR, and a toy zkVM."
license = "MIT"

[dependencies]
blake3 = "1"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
bincode = "1"
thiserror = "1"

[dev-dependencies]
proptest = "1"
